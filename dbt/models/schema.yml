version: 2

sources:
  - name: raw
    description: "Raw JSON files loaded into the warehouse (Bronze layer)"
    tables:
      - name: sessions
        description: "Raw user session events from the product event tracker"
        columns:
          - name: session_id
            tests: [not_null, unique]
          - name: user_id
            tests: [not_null]
      - name: pages
        description: "Page metadata and funnel step definitions"
        columns:
          - name: page_id
            tests: [not_null, unique]

models:
  - name: stg_sessions
    description: "Silver layer: cleaned and validated session records"
    columns:
      - name: session_id
        tests: [not_null, unique]
      - name: device
        description: "Normalized to lowercase (DQ-2)"
      - name: is_suspicious
        description: "True when duration_sec < 5s — likely bot traffic (DQ-6)"

  - name: stg_pages
    description: "Silver layer: cleaned page / funnel step reference data"
    columns:
      - name: page_id
        tests: [not_null, unique]
      - name: funnel_step
        tests: [not_null]

  - name: mart_funnel_metrics
    description: "Gold layer: session counts, avg duration, CTA clicks, CVR per funnel step"
    columns:
      - name: session_count
        tests: [not_null]
      - name: conversion_rate_pct
        description: "conversions / session_count * 100, rounded to 1dp"

  - name: mart_device_metrics
    description: "Gold layer: CTR and CVR breakdown by device type"
    columns:
      - name: device
        tests: [not_null, unique]
      - name: cvr_pct
        description: "Conversion rate per device type"
